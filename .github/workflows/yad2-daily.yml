name: Yad2 daily sale and rental dataset
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
concurrency:
  group: yad2-daily-dataset
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
      SCRAPINGBEE_STEALTH_PROXY: 'true'
      YAD2_MAX_REQUESTS: '60'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.server.json --noEmit false --outDir .server-build
      - run: node scripts/yad2-sync.mjs
