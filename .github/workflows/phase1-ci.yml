name: Phase 1 CI
# Backend contract gate for Phase 1 market intelligence.

on:
  push:
    branches:
      - phase1-market-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Phase 1 regression tests
        run: npm run test:phase1
      - name: Server typecheck
        run: npm run check:server
      - name: Production-data contract smoke
        run: node scripts/validate-phase1-context.mjs
      - name: Frontend typecheck and build
        run: |
          node reconstruct.mjs
          node scripts/inject-neighborhood-ui.mjs
          npx tsc -b
          npx vite build
