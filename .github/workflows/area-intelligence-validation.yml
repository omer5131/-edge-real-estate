name: Area Intelligence Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "db/015_area_intelligence.sql"
      - "db/016_statistical_area_identity.sql"
      - "db/017_neighborhood_intelligence.sql"
      - "db/018_semantic_graph.sql"
      - "server/neighborhoodIdentity.ts"
      - "db/019_neighborhood_identity.sql"
      - "server/areaScoring.ts"
      - "server/areaIntelligence.ts"
      - "server/neighborhoodIntelligence.ts"
      - "server/http/area-intelligence.ts"
      - "server/http/neighborhood-intelligence.ts"
      - "server/http/data-explorer.ts"
      - "server/http/agent-chat.ts"
      - "server/agent/deepseekAgents.ts"
      - "scripts/migrate-area-intelligence.mjs"
      - "scripts/validate-area-intelligence.mjs"
      - "scripts/migrate-yad2.mjs"
      - "tests/area-scoring.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify DB secret
        run: test -n "$DATABASE_URL"
      - name: Frontend typecheck
        run: |
          node reconstruct.mjs
          node scripts/inject-neighborhood-ui.mjs
          npx tsc -b --pretty false
      - name: Server typecheck
        run: npx tsc -p tsconfig.server.json --pretty false
      - name: Scoring tests
        run: npm run test:areas
      - name: Apply semantic/area migrations
        run: npm run migrate:areas
      - name: Download official CBS neighborhood key
        run: |
          curl --fail --location --retry 5 --retry-all-errors --http1.1 \
            --connect-timeout 30 --max-time 180 \
            -A "Mozilla/5.0" \
            -o /tmp/cbs-neighborhood-key.xlsx \
            "https://www.cbs.gov.il/he/mediarelease/doclib/2022/026/%D7%A8%D7%97%D7%95%D7%91%D7%95%D7%AA%20%D7%A2%D7%99%D7%A7%D7%A8%D7%99%D7%99%D7%9D%20%D7%95%D7%A9%D7%9B%D7%95%D7%A0%D7%95%D7%AA%20%D7%9C%D7%90%D7%A1%202022.xlsx"
      - name: Import official CBS neighborhood key
        env:
          CBS_XLSX_PATH: /tmp/cbs-neighborhood-key.xlsx
        run: npm run import:cbs-neighborhoods
      - name: Build server modules
        run: npx tsc -p tsconfig.server.json --noEmit false --outDir .server-build
      - name: Refresh and validate neighborhood intelligence
        run: |
          mkdir -p artifacts
          node scripts/validate-area-intelligence.mjs | tee artifacts/neighborhood-validation.log
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-intelligence-validation
          path: |
            artifacts/neighborhood-validation.json
            artifacts/neighborhood-validation.log
          retention-days: 14
