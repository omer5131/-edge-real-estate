name: Resume OVER backfills

on:
  push:
    branches: [main]
    paths:
      - '.github/backfill-trigger'
  workflow_dispatch:

concurrency:
  group: over-backfill-resume
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.server.json --noEmit false --outDir .server-build
      - name: Resume interrupted OVER backfills to completion
        run: |
          node --input-type=module <<'NODE'
          const { runOverDatasets } = await import('./.server-build/server/sources/overDatasets.js');
          const { queryDatabase } = await import('./.server-build/server/db.js');

          const ids = [
            'fd06f5ae-8a4f-4120-b275-8a514ad23499',
            'ff3176b1-aafc-49c2-976d-ba25571e3564'
          ];
          const deadline = Date.now() + 110 * 60 * 1000;
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          for (const id of ids) {
            while (Date.now() < deadline - 90_000) {
              const [before] = await queryDatabase(
                'SELECT dataset_id,title,status,row_count,cursor,last_error FROM over_datasets WHERE dataset_id=$1::uuid',
                [id]
              );
              console.log('STATE BEFORE', JSON.stringify(before));
              if (!before?.cursor && before?.status === 'healthy') break;

              const report = await runOverDatasets({ datasetId: id, budgetMs: 230000, maxPages: 100 });
              console.log('SYNC REPORT', JSON.stringify(report));

              if (report?.skipped) {
                await sleep(5000);
                continue;
              }
              const failed = report?.datasets?.find(d => d.error);
              if (failed) {
                console.error('Dataset sync error', failed.error);
                await sleep(10000);
              }
            }

            const [after] = await queryDatabase(
              'SELECT dataset_id,title,status,row_count,cursor,last_error FROM over_datasets WHERE dataset_id=$1::uuid',
              [id]
            );
            console.log('STATE AFTER', JSON.stringify(after));
            if (after?.cursor || after?.status !== 'healthy') {
              throw new Error('Backfill did not complete for ' + id + ': ' + JSON.stringify(after));
            }
          }
          NODE
