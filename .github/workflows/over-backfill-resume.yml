name: Haifa parcel geometry backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/backfill-trigger'
  workflow_dispatch:

concurrency:
  group: haifa-parcel-geometry-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.server.json --noEmit false --outDir .server-build
      - name: Backfill Haifa parcel geometry to completion
        run: |
          node --input-type=module <<'NODE'
          const { runOverDatasets } = await import('./.server-build/server/sources/overDatasets.js');
          const { queryDatabase } = await import('./.server-build/server/db.js');

          const id = 'ff3176b1-aafc-49c2-976d-ba25571e3564';
          const deadline = Date.now() + 350 * 60 * 1000;
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          while (Date.now() < deadline - 90_000) {
            const [state] = await queryDatabase(
              'SELECT dataset_id,title,enabled,status,row_count,cursor,last_error,filters,last_success_at FROM over_datasets WHERE dataset_id=$1::uuid',
              [id]
            );
            console.log('HAIFA GEOMETRY STATE', JSON.stringify(state));
            if (!state?.enabled) throw new Error('Haifa parcel geometry dataset is disabled');
            if (!state?.cursor && state?.status === 'healthy' && state?.last_success_at) break;

            const report = await runOverDatasets({ datasetId: id, budgetMs: 230000, maxPages: 100 });
            console.log('HAIFA GEOMETRY REPORT', JSON.stringify(report));
            if (report?.skipped) {
              await sleep(5000);
              continue;
            }
            const failed = report?.datasets?.find(d => d.error);
            if (failed) await sleep(15000);
          }

          const [after] = await queryDatabase(
            'SELECT dataset_id,title,status,row_count,cursor,last_error,filters,last_success_at FROM over_datasets WHERE dataset_id=$1::uuid',
            [id]
          );
          console.log('HAIFA GEOMETRY FINAL', JSON.stringify(after));
          if (after?.cursor || after?.status !== 'healthy' || !after?.last_success_at) {
            throw new Error('Haifa parcel geometry backfill did not complete: ' + JSON.stringify(after));
          }
          NODE
