<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge · מחקר יד2</title>
<style>body{background:#11151c;color:#e7eaf0;font:15px system-ui;margin:32px}a{color:#b7cbff}input,select,button{font:inherit;padding:10px;border:1px solid #465063;border-radius:6px;background:#212735;color:inherit}form{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:12px;border-bottom:1px solid #333b49;white-space:nowrap}small{color:#b0b8c7}pre{white-space:pre-wrap;direction:ltr;text-align:left}dialog{background:#212735;color:inherit;border:1px solid #465063;max-width:80vw}#table{overflow:auto}</style>
<a href="/">← Edge</a><h1>מחקר יד2 · מכירה והשכרה</h1><p>המודעות מכל אזורי האיסוף. המחיר הוא מחיר מבוקש; בהשכרה הוא חודשי.</p>
<form id="filters"><select name="market"><option value="">מכירה והשכרה</option><option value="sale">מכירה</option><option value="rent">השכרה</option></select><input name="city" placeholder="עיר"><input name="search" placeholder="כתובת / תיאור"><input name="minPrice" type="number" placeholder="מחיר מינ׳"><input name="maxPrice" type="number" placeholder="מחיר מקס׳"><input name="minRooms" type="number" step=".5" placeholder="חדרים מינ׳"><input name="minArea" type="number" placeholder="שטח מינ׳"><select name="status"><option value="">כל הסטטוסים</option><option value="active">פעיל</option><option value="inactive">לא נצפה ב-3 סבבים מלאים</option></select><label><input name="priceDrops" type="checkbox" value="true">הורדות מחיר</label><button>חיפוש</button></form>
<p id="status" role="status"></p><div id="table"></div><button id="prev">הקודם</button> <button id="next">הבא</button><details><summary>מצב האיסוף</summary><pre id="health"></pre></details><dialog id="history"><button id="close">סגירה</button><h2>היסטוריית מודעה</h2><pre id="events"></pre></dialog>
<script type="module">
let offset=0,total=0;const $=id=>document.getElementById(id);const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){ $('status').textContent='טוען…';try{const p=new URLSearchParams(new FormData($('filters')));for(const [k,v]of [...p])if(!v)p.delete(k);p.set('offset',offset);const r=await fetch('/api/yad2-research?'+p);const d=await r.json();if(!r.ok)throw Error('מאגר יד2 עדיין לא זמין. נדרשים הגדרת החיבור וריצה ראשונה.');total=d.total;$('status').textContent=`${total} מודעות תואמות · ${offset+1}–${Math.min(offset+d.rows.length,total)}`;
$('table').innerHTML='<table><thead><tr>'+['סוג','כתובת','עיר / שכונה','מחיר ₪','חדרים','מ״ר','קומה','פרסום במקור','נצפה לראשונה','נצפה לאחרונה','סטטוס','היסטוריה'].map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+d.rows.map((x,i)=>`<tr><td>${x.market==='sale'?'מכירה':'השכרה'}</td><td><a target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.address||x.listing_id)}</a></td>${[`${x.city??''} / ${x.neighborhood??''}`,x.price,x.rooms,x.area_sqm,x.floor,x.published_at,x.first_seen_at,x.last_seen_at,x.status].map(v=>`<td>${esc(v)}</td>`).join('')}<td><button data-i="${i}">שינויים</button></td></tr>`).join('')+'</tbody></table>';
$('table').querySelectorAll('button').forEach(b=>b.onclick=async()=>{const x=d.rows[b.dataset.i];const r=await fetch('/api/yad2-research?'+new URLSearchParams({history:x.listing_id,market:x.market}));const j=await r.json();$('events').textContent=JSON.stringify(j.rows??j,null,2);$('history').showModal();});$('prev').disabled=offset===0;$('next').disabled=offset+50>=total;
}catch(e){$('status').textContent=e.message;}}
$('filters').onsubmit=e=>{e.preventDefault();offset=0;load();};$('prev').onclick=()=>{offset=Math.max(0,offset-50);load();};$('next').onclick=()=>{offset+=50;load();};$('close').onclick=()=>$('history').close();load();fetch('/api/yad2-admin').then(r=>r.json()).then(d=>$('health').textContent=JSON.stringify(d,null,2));
</script></html>
